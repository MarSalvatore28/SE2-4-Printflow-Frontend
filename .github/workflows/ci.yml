name: CI frontend

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No hay secretos en el repo
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production)$'; then
            echo "Hay un archivo .env versionado. Quitarlo."; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # El código heredado trae ~114 errores de lint. Por ahora el lint avisa pero no bloquea.
      # Cuando cada equipo limpie su carpeta, quitar continue-on-error.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Tipos + build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construye la imagen web
        run: docker build -t printflow-web .
