# --- Cabeceras de seguridad ---------------------------------------------------------------
# Todas se agregan a nivel de server (más abajo). OJO: nginx no hereda los add_header de server
# en un location que tenga su propio add_header; por eso ningún location define add_header y lo
# que cambia según la ruta (CSP, caché) sale de estos map.

# CSP de la SPA:
#   - script-src 'self': solo los JS que compila Vite (sin scripts inline ni eval).
#   - style-src 'unsafe-inline': MUI (emotion) y algunos modales insertan <style>, y React usa
#     style="..."; las fuentes vienen de Google Fonts.
#   - connect-src 'self': la API (/api/) y Socket.IO (/socket.io/, también por WebSocket) están en
#     el mismo origen. Si se compila con VITE_API_BASE_URL apuntando a otro dominio, hay que sumarlo.
#   - img-src data: blob:: imágenes que Vite incrusta y las vistas previas de archivos.
map $uri $pf_csp_ruta {
    ~^/api-docs          "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    ~^/(api|socket\.io)/ "default-src 'none'; frame-ancestors 'none'";
    default              "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

# Si la API ya manda una cabecera (helmet), nginx no agrega otra: así no quedan duplicadas ni con
# valores que se contradigan. Para lo que sirve nginx (la SPA), $upstream_http_* está vacío.
map $upstream_http_content_security_policy $pf_csp {
    ""      $pf_csp_ruta;
    default "";
}
map $upstream_http_x_content_type_options $pf_nosniff {
    ""      "nosniff";
    default "";
}
map $upstream_http_x_frame_options $pf_frame {
    ""      "DENY";
    default "";
}
map $upstream_http_referrer_policy $pf_referrer {
    ""      "strict-origin-when-cross-origin";
    default "";
}
map $upstream_http_cross_origin_opener_policy $pf_coop {
    ""      "same-origin";
    default "";
}
map $upstream_http_permissions_policy $pf_permisos {
    ""      "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()";
    default "";
}

# Caché: los archivos de /assets/ llevan un hash en el nombre (Vite), así que pueden guardarse un
# año; index.html (y las rutas de la SPA, que lo devuelven) se revalida siempre para que un
# despliegue nuevo se vea al recargar. Las respuestas de la API no se tocan.
map $uri $pf_cache {
    ~^/assets/           "public, max-age=31536000, immutable";
    ~^/api-docs          "";
    ~^/(api|socket\.io)/ "";
    default              "no-cache";
}

server {
    listen 80;
    server_name _;

    # Sin la versión de nginx en las cabeceras ni en las páginas de error
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # always: también en las respuestas de error (403, 404, 502...). Un valor vacío no se envía.
    add_header Content-Security-Policy $pf_csp always;
    add_header X-Content-Type-Options $pf_nosniff always;
    add_header X-Frame-Options $pf_frame always;
    add_header Referrer-Policy $pf_referrer always;
    add_header Cross-Origin-Opener-Policy $pf_coop always;
    add_header Permissions-Policy $pf_permisos always;
    add_header Cache-Control $pf_cache;

    # La API se resuelve en cada petición (DNS interno de Docker, caché de 10 s): si el contenedor
    # de la API se recrea y cambia de IP, nginx la encuentra sin reiniciar la web. Con un nombre
    # fijo en proxy_pass, nginx guarda la IP al arrancar y responde 502 hasta reiniciarlo.
    # proxy_pass con variable y sin ruta reenvía la URI tal como llegó (igual que antes).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:9000;

    # La ingesta solo se acepta desde la red interna de Docker (n8n -> api:9000).
    # Desde fuera, por el proxy, queda bloqueada. (Criterio de S2-03)
    location /api/ingesta {
        return 403;
    }

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api-docs {
        proxy_pass $api;
        proxy_set_header Host $host;
    }

    # Notificaciones en tiempo real (WebSocket)
    location /socket.io/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Archivos con hash de Vite: si no existe, 404 (no index.html, que el navegador rechazaría como JS)
    location /assets/ {
        try_files $uri =404;
    }

    # Rutas de la SPA (React Router)
    location / {
        try_files $uri /index.html;
    }
}
