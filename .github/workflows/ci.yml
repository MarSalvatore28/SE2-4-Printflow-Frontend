name: CI frontend

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No hay secretos en el repo
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production)$'; then
            echo "Hay un archivo .env versionado. Quitarlo."; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Sin scripts de instalación: ninguna dependencia los necesita para compilar o probar
      - run: npm ci --ignore-scripts

      # ESLint está en 0 errores: un error nuevo hace fallar el CI
      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Tipos + build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construye la imagen web
        run: docker build -t printflow-web .
